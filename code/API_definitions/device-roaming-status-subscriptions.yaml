externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/DeviceRoamingStatus

servers:
  - url: "{apiRoot}/device-roaming-status-subscriptions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Device roaming status subscription
    description: Operation to manage event subscription on device roaming status event.

paths:
  /subscriptions:
    post:
      tags:
        - Device roaming status subscription
      summary: "Create a device roaming status event subscription for a device"
      description: Create a device roaming status event subscription for a device
      operationId: createDeviceRoamingStatusSubscription
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      security:
        - openId:
            - device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-status:create
            - device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-on:create
            - device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-off:create
            - device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-change-country:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
            examples:
              Create Subscription:
                $ref: "#/components/examples/CREATE_SUBSCRIPTION"
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: "notifications callback"
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                The Device status server will call this endpoint whenever any device roaming status related event occurs.
              operationId: postNotification
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/NotificationEvent"
                    examples:
                      roaming-status:
                        $ref: "#/components/examples/ROAMING_STATUS"
                      roaming-change-country:
                        $ref: "#/components/examples/ROAMING_CHANGE_COUNTRY"
                      roaming-on:
                        $ref: "#/components/examples/ROAMING_ON"
                      roaming-off:
                        $ref: "#/components/examples/ROAMING_OFF"
                      subscription-started:
                        $ref: "#/components/examples/SUBSCRIPTION_STARTED"
                      subscription-updated:
                        $ref: "#/components/examples/SUBSCRIPTION_UPDATED"
                      subscription-ended:
                        $ref: "#/components/examples/SUBSCRIPTION_ENDED"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "#/components/responses/Generic400"
                "401":
                  $ref: "#/components/responses/Generic401"
                "403":
                  $ref: "#/components/responses/Generic403"
                "410":
                  $ref: "#/components/responses/Generic410"
                "429":
                  $ref: "#/components/responses/Generic429"
              security:
                - {}
                - notificationsBearerAuth: []

      responses:
        "201":
          description: Created
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
              examples:
                Active Subscription:
                  $ref: "#/components/examples/ACTIVE_SUBSCRIPTION"
                Active Subscription With Device Disambiguation:
                  $ref: "#/components/examples/ACTIVE_SUBSCRIPTION_WITH_DEVICE_DISAMBIGUATION"
        "202":
          description: Request accepted to be processed. It applies for async creation process.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "#/components/responses/CreateSubscriptionBadRequest400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/SubscriptionPermissionDenied403"
        "409":
          $ref: "#/components/responses/Generic409"
        "422":
          $ref: "#/components/responses/CreateSubscriptionUnprocessableEntity422"
        "429":
          $ref: "#/components/responses/Generic429"

    get:
      tags:
        - Device roaming status subscription
      summary: "Retrieve a list of device roaming status event subscription"
      description: Retrieve a list of device roaming status event subscription(s)
      operationId: retrieveDeviceRoamingStatusSubscriptionList
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/page"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/perPage"
      security:
        - openId:
            - device-roaming-status-subscriptions:read
      responses:
        "200":
          description: List of event subscription details
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-count"
            X-Total-Pages:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-pages"
            Link:
              $ref: "../common/CAMARA_common.yaml#/components/headers/link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
              examples:
                List of Subscriptions:
                  $ref: "#/components/examples/SUBSCRIPTION_LIST"
                Empty List of Subscriptions:
                  $ref: "#/components/examples/EMPTY_SUBSCRIPTION_LIST"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"

  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Device roaming status subscription
      summary: "Retrieve a roaming status event subscription for a device"
      description: retrieve device roaming status subscription information for a given subscription.
      operationId: retrieveDeviceRoamingStatusSubscription
      security:
        - openId:
            - device-roaming-status-subscriptions:read
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
              examples:
                Active Subscription:
                  $ref: "#/components/examples/ACTIVE_SUBSCRIPTION"
                Active Subscription With Device Disambiguation:
                  $ref: "#/components/examples/ACTIVE_SUBSCRIPTION_WITH_DEVICE_DISAMBIGUATION"
                Subscription Activation Requested:
                  $ref: "#/components/examples/SUBSCRIPTION_ACTIVATION_REQUESTED"
                Subscription Deleted:
                  $ref: "#/components/examples/SUBSCRIPTION_DELETED"
        "400":
          $ref: "#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"

    delete:
      tags:
        - Device roaming status subscription
      summary: "Delete a device-roaming-status event subscription for a device"
      operationId: deleteDeviceRoamingStatusSubscription
      description: Delete a given device-roaming-status subscription by ID
      security:
        - openId:
            - device-roaming-status-subscriptions:delete
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      responses:
        "204":
          description: device-roaming-status subscription deleted
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        "202":
          description: Request accepted to be processed. It applies for async deletion process.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      description: Subscription identifier that was obtained from the create event subscription operation
      required: true
      schema:
        $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

  schemas:
    SubscriptionList:
      description: Response with subscriptions list
      type: object
      required:
        - subscriptions
        - pagination
      properties:
        subscriptions:
          description: Subscriptions list
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/Subscription"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    SubscriptionRequest:
      description: The request for creating a event-type event subscription
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The address to which events shall be delivered using the selected protocol.
          example: "https://endpoint.example.com/sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
            References DeviceRoamingEventType (not the full NotificationEvent union) —
            subscription requests target API-specific events only; lifecycle
            events are server-initiated and cannot be subscribed to directly.
            Note: only one event type per subscription is supported.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/DeviceRoamingEventType"
        config:
          $ref: "#/components/schemas/Config"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionRequest"
          # Future protocol support (not yet used in CAMARA):
          # MQTT3: "#/components/schemas/MQTTSubscriptionRequest"
          # MQTT5: "#/components/schemas/MQTTSubscriptionRequest"
          # AMQP: "#/components/schemas/AMQPSubscriptionRequest"
          # NATS: "#/components/schemas/NATSSubscriptionRequest"
          # KAFKA: "#/components/schemas/ApacheKafkaSubscriptionRequest"

    Config:
      description: |
        Implementation-specific configuration parameters needed by the subscription manager for acquiring events.
        In CAMARA we have predefined attributes like `subscriptionExpireTime`, `subscriptionMaxEvents`, `initialEvent`
        Specific event type attributes must be defined in `subscriptionDetail`.
        Note: if a request is performed for several event types, all subscribed events will use same `config` parameters.
      type: object
      required:
        - subscriptionDetail
      properties:
        subscriptionDetail:
          $ref: "#/components/schemas/CreateSubscriptionDetail"
        subscriptionExpireTime:
          type: string
          format: date-time
          maxLength: 64
          example: 2023-01-17T13:18:23.682Z
          description: The subscription expiration time (in date-time format) requested by the API consumer. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
        subscriptionMaxEvents:
          type: integer
          format: int32
          description: Identifies the maximum number of event reports to be generated (>=1) requested by the API consumer - Once this number is reached, the subscription ends.
          minimum: 1
          maximum: 1000000
          example: 5
        initialEvent:
          type: boolean
          description: |
            Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.
            Example: Consumer request Roaming event. If consumer sets initialEvent to true and device is in roaming situation, an event is triggered.

    CreateSubscriptionDetail:
      description: The detail of the requested event subscription.
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"

    DeviceRoamingEventType:
      type: string
      description: |
        Enum of API-specific event type strings for this API project.
        The reverse-DNS prefix `org.camaraproject.device-roaming-status-subscriptions`
        makes each value globally unique across API groups.
      enum:
        - org.camaraproject.device-roaming-status-subscriptions.v0.roaming-status
        - org.camaraproject.device-roaming-status-subscriptions.v0.roaming-on
        - org.camaraproject.device-roaming-status-subscriptions.v0.roaming-off
        - org.camaraproject.device-roaming-status-subscriptions.v0.roaming-change-country

    Subscription:
      description: Represents a event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
      properties:
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The address to which events shall be delivered using the selected protocol.
          example: "https://endpoint.example.com/sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
            Note: only one event type per subscription is supported.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/DeviceRoamingEventType"
        config:
          $ref: '#/components/schemas/Config'
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        startsAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        expiresAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        status:
          type: string
          description: |-
            Current status of the subscription - Management of Subscription State engine is not mandatory for now. Note not all statuses may be considered to be implemented. Details:
              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is triggered but subscription creation process is not finished yet.
              - `ACTIVE`: Subscription creation process is completed. Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active). This status applies when subscription is ended due to `SUBSCRIPTION_EXPIRED` or `ACCESS_TOKEN_EXPIRED` event.
              - `DELETED`: Subscription is ended as deleted (no longer active). This status applies when subscription information is kept (i.e. subscription workflow is no longer active but its meta-information is kept).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionResponse"
          # Future protocol support (not yet used in CAMARA):
          # MQTT3: "#/components/schemas/MQTTSubscriptionResponse"
          # MQTT5: "#/components/schemas/MQTTSubscriptionResponse"
          # AMQP: "#/components/schemas/AMQPSubscriptionResponse"
          # NATS: "#/components/schemas/NATSSubscriptionResponse"
          # KAFKA: "#/components/schemas/ApacheKafkaSubscriptionResponse"

    Device:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    DeviceResponse:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"

    PhoneNumber:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/PhoneNumber"

    NetworkAccessIdentifier:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/NetworkAccessIdentifier"

    DeviceIpv4Addr:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceIpv4Address"

    SingleIpv4Addr:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/SingleIpv4Address"

    Port:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"

    DeviceIpv6Address:
      $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceIpv6Address"

    CountryCode:
      description: The Mobile country code (MCC) as an geographic region identifier for the country and the dependent areas.
      type: integer

    CountryName:
      description: The ISO 3166 ALPHA-2 country-codes of mapped to mobile country code(MCC). If there is mapping of one MCC to multiple countries, then we have list of countries. If there is no mapping of MCC to any country, then an empty array [] shall be returned..
      type: array
      items:
        type: string

    SubscriptionAsync:
      description: Response for a device reachability status operation managed asynchronously (Creation or Deletion)
      type: object
      required:
        - id
      properties:
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

    SubscriptionLifecycleEventType:
      type: string
      description: |
        Enum of subscription lifecycle event type strings.
        These are managed by Commonalities and are identical across all CAMARA
        APIs that support explicit subscriptions.
      enum:
        - org.camaraproject.device-roaming-status-subscriptions.v0.subscription-started
        - org.camaraproject.device-roaming-status-subscriptions.v0.subscription-updated
        - org.camaraproject.device-roaming-status-subscriptions.v0.subscription-ended

    SubscriptionLifecycleEvent:
      description: |
        Subscription lifecycle event group, common to all CAMARA APIs that
        support explicit subscriptions.
        Extends the CloudEvent envelope and constrains `type` to the set of
        lifecycle event types managed by Commonalities.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/SubscriptionLifecycleEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.device-roaming-status-subscriptions.v0.subscription-started: "#/components/schemas/EventSubscriptionStarted"
          org.camaraproject.device-roaming-status-subscriptions.v0.subscription-updated: "#/components/schemas/EventSubscriptionUpdated"
          org.camaraproject.device-roaming-status-subscriptions.v0.subscription-ended: "#/components/schemas/EventSubscriptionEnded"

    ApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
        Adding a new event type only requires updating DeviceRoamingEventType and the
        discriminator mapping below — the CloudEvent base never changes.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/DeviceRoamingEventType"
      discriminator:
        propertyName: "type"
        mapping:
          org.camaraproject.device-roaming-status-subscriptions.v0.roaming-status: "#/components/schemas/EventRoamingStatus"
          org.camaraproject.device-roaming-status-subscriptions.v0.roaming-on: "#/components/schemas/EventRoamingOn"
          org.camaraproject.device-roaming-status-subscriptions.v0.roaming-off: "#/components/schemas/EventRoamingOff"
          org.camaraproject.device-roaming-status-subscriptions.v0.roaming-change-country: "#/components/schemas/EventRoamingChangeCountry"

    NotificationEvent:
      description: |
        Union of all valid notification event groups at the callback endpoint.
        This schema owns no discriminator — routing within each group is
        handled by ApiNotificationEvent and SubscriptionLifecycleEvent
        respectively. Its only responsibility is to enumerate which groups
        are valid payloads for this API's notification callback.
      oneOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"

    EventRoamingStatus:
      description: event structure for roaming status change
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RoamingStatus"

    EventRoamingOn:
      description: event structure for roaming on change
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BasicDeviceEventData"

    EventRoamingOff:
      description: event structure for roaming off change
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BasicDeviceEventData"

    EventRoamingChangeCountry:
      description: event structure for roaming change country
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RoamingChangeCountry"

    EventSubscriptionEnded:
      description: Event structure for sending subscription-ended event
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SubscriptionEnded"

    EventSubscriptionStarted:
      description: Event structure for event subscription started
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SubscriptionStarted"

    SubscriptionStarted:
      description: Event detail structure for subscription started event
      type: object
      required:
        - initiationReason
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/Device"
        initiationReason:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/InitiationReason"
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        initiationDescription:
          description: Description about the start of the subscription.
          type: string
          maxLength: 512

    EventSubscriptionUpdated:
      description: Event structure for event subscription updated
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SubscriptionUpdated"

    SubscriptionUpdated:
      description: Event detail structure for subscription updated event
      type: object
      required:
        - updateReason
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/Device"
        updateReason:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/UpdateReason"
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        updateDescription:
          description: Description about the subscription update.
          type: string
          maxLength: 512

    BasicDeviceEventData:
      description: Event detail structure for basic device events
      type: object
      required:
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceResponse"
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

    RoamingStatus:
      description: Event detail structure for org.camaraproject.device-roaming-status-subscriptions.v0.roaming-status event
      allOf:
        - $ref: "#/components/schemas/BasicDeviceEventData"
        - type: object
          required:
            - roaming
          properties:
            roaming:
              type: boolean
              description: Roaming status. True, if it is roaming.
            countryCode:
              $ref: "#/components/schemas/CountryCode"
            countryName:
              $ref: "#/components/schemas/CountryName"

    RoamingChangeCountry:
      description: Event detail structure for org.camaraproject.device-roaming-status-subscriptions.v0.roaming-on event
      allOf:
        - $ref: "#/components/schemas/BasicDeviceEventData"
        - type: object
          required:
            - countryCode
            - countryName
          properties:
            countryCode:
              $ref: "#/components/schemas/CountryCode"
            countryName:
              $ref: "#/components/schemas/CountryName"

    SubscriptionEnded:
      description: Event detail structure for subscription-ended event
      type: object
      required:
        - terminationReason
        - subscriptionId
      properties:
        device:
          $ref: "#/components/schemas/DeviceResponse"
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        terminationReason:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/TerminationReason"
        terminationDescription:
          type: string
          maxLength: 512
          description: Description of subscription termination

